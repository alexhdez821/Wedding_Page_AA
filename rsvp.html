<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP | Alejandro y Alejandra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #b8816b;
      --bg: #f8f4ef;
      --card: #fffaf6;
      --text: #3d342f;
      --muted: #7a6b63;
      --accent: #9c6853;
      --line: #eadfd6;
      --shadow: 0 14px 34px rgba(88, 62, 48, 0.09);
      --radius-md: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    h1, h2, h3, h4 {
      font-family: "Cormorant Garamond", Georgia, serif;
      line-height: 1.2;
    }

    .container {
      width: min(860px, 92%);
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(248, 244, 239, 0.95);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
    }

    .brand {
      font-size: clamp(1.25rem, 2.4vw, 1.7rem);
      font-weight: 700;
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid var(--primary);
      font-weight: 600;
      transition: transform .2s ease, background .25s ease, color .25s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-secondary {
      color: var(--accent);
      background: transparent;
    }

    .btn-secondary:hover { background: rgba(184, 129, 107, 0.12); }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--accent); }

    main { padding: clamp(2rem, 6vw, 4rem) 0; }

    .section-title {
      text-align: center;
      font-size: clamp(2.1rem, 4.8vw, 2.8rem);
      margin: 0 0 10px;
      color: #4a3e38;
    }

    .section-copy {
      text-align: center;
      color: var(--muted);
      margin: 0 auto 28px;
      max-width: 680px;
    }

    .rsvp-shell {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      padding: clamp(1.2rem, 3vw, 2rem);
    }

    .rsvp-form { display: grid; gap: 16px; }
    .form-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }

    .rsvp-form label {
      display: block;
      font-size: 0.94rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #5a4a42;
    }

    .rsvp-form input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d8c8bb;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-size: 1rem;
    }

    .rsvp-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(156, 104, 83, 0.14);
    }

    .inline-note { margin: 0; color: var(--muted); font-size: 0.92rem; }
    .result-card { border-radius: 14px; padding: 14px; border: 1px solid; margin-bottom: 14px; background: #fff; }
    .result-card h3 { margin: 0 0 5px; font-size: 1.35rem; }
    .result-card p { margin: 0; color: #5e5048; }
    .result-card.success { border-color: #cfdfcf; background: #f6fbf5; }
    .result-card.error { border-color: #ead0cf; background: #fff7f7; }
    .result-card.warning { border-color: #eadfb5; background: #fffcf0; }
    .invited-list { margin: 10px 0 0; padding-left: 18px; color: #5c4d45; }
    .person-row { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
    .person-label { margin-bottom: 8px; font-weight: 700; color: #4f4038; }
    .person-options { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .person-options label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 500; }
    .person-options input { width: auto; margin: 0; padding: 0; }
    .plus-one-block { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 10px; }
    .form-error { min-height: 1.3em; margin: 0; color: #b14d49; font-size: 0.92rem; font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">Alejandro y Alejandra</div>
        <a class="btn btn-secondary" href="index.html">Volver al inicio</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="section-title">RSVP</h1>
      <p class="section-copy">Please confirm before <strong>September 1st, 2026</strong>. Find your invitation and respond for your full party below.</p>
      <div class="rsvp-shell">
        <form id="lookupForm" class="rsvp-form" novalidate>
          <h3>Find your invitation</h3>
          <p class="inline-note">Enter the first and last name exactly as shown on your invitation.</p>
          <div class="form-grid">
            <div>
              <label for="lookupFirstName">First name</label>
              <input id="lookupFirstName" name="lookupFirstName" type="text" autocomplete="given-name" required>
            </div>
            <div>
              <label for="lookupLastName">Last name</label>
              <input id="lookupLastName" name="lookupLastName" type="text" autocomplete="family-name" required>
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Find invitation</button>
          <p id="lookupError" class="form-error" aria-live="polite"></p>
        </form>
        <div id="rsvpResult" style="margin-top:16px;"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initRsvpFlow } from "./rsvp-logic.js";

    initRsvpFlow();
  </script>
</body>
</html>
