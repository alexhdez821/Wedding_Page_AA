<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alejandro y Alejandra | Nuestra Boda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body { margin:0; font-family:Inter,sans-serif; background:#f7f3ee; }

    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 2100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #2b211c, #4a342a);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .intro-overlay.is-complete {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-envelope {
      width: 360px;
      height: 600px;
      background: #6e7560;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }

    .intro-letter {
      position: absolute;
      inset: 12%;
      background: url("./images/greeting_photo.jpg") center/cover;
      border-radius: 12px;
      transform: translateY(40%);
      opacity: 0;
      animation: letterOut 1.2s ease forwards 1s;
    }

    @keyframes letterOut {
      to {
        transform: translateY(-10%);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

<div class="intro-overlay" id="introOverlay">
  <div class="intro-envelope">
    <div class="intro-letter"></div>
  </div>
</div>

<script>
  const overlay = document.getElementById("introOverlay");

  setTimeout(() => {
    overlay.classList.add("is-complete");
  }, 2500);
</script>

</body>
</html>
