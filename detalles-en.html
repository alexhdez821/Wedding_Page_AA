<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Details | Alejandro & Alejandra</title>
    <style>
      :root {
        --ivory: #f8f3eb;
        --paper: rgba(255, 250, 244, 0.8);
        --text: #3d342f;
        --terracotta: #b8816b;
        --terracotta-dark: #93624f;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--ivory);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ivory);
        color: var(--text);
        font-family: "Montserrat", Arial, Helvetica, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid rgba(184, 129, 107, 0.17);
        background: var(--paper);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      nav {
        width: min(1180px, 92vw);
        margin: 0 auto;
        min-height: 76px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
      }

      .brand {
        grid-column: 2;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.55rem, 2.6vw, 2.05rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
        color: #423832;
      }

      .btn {
        justify-self: end;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        min-height: 44px;
        padding: 0.68rem 1.08rem;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid var(--terracotta);
        color: var(--terracotta-dark);
        background: rgba(255, 250, 244, 0.54);
        font-weight: 700;
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .btn:hover,
      .btn:focus-visible {
        transform: translateY(-2px);
        background: rgba(255, 250, 244, 0.92);
        box-shadow: 0 10px 24px rgba(61, 52, 47, 0.08);
      }

      .header-home-btn {
        justify-self: end;
      }

      .page {
        max-width: 820px;
        margin: 0 auto;
        padding: 1.35rem 0.75rem 2rem;
      }

      .invitation {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 18px 45px rgba(61, 52, 47, 0.14);
      }

      @media (max-width: 900px) {
        header {
          background: rgba(248, 243, 235, 0.92);
        }

        nav {
          min-height: 58px;
          grid-template-columns: 1fr auto;
          gap: 0.5rem;
        }

        .brand {
          grid-column: 1;
          justify-self: start;
          max-width: 170px;
          font-size: 1.18rem;
          line-height: 1.05;
          text-align: left;
        }

        .header-home-btn {
          width: 42px;
          height: 42px;
          min-height: 42px;
          padding: 0;
          border-radius: 50%;
          font-size: 1rem;
        }

        .header-home-btn .desktop-word {
          display: none;
        }
      }

      @media (max-width: 600px) {
        .page {
          padding: 1rem 0.5rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <span class="brand">Alejandro y Alejandra</span>
        <a class="btn btn-secondary header-home-btn" href="rsvp.html" aria-label="Back to RSVP">
          ⌂ <span class="desktop-word">Back to RSVP</span>
        </a>
      </nav>
    </header>

    <main class="page">
      <img
        class="invitation"
        src="images/INVITACION_FINAL_INGLES.png"
        alt="Wedding invitation details for Alejandro and Alejandra"
      />
    </main>
  </body>
</html>
