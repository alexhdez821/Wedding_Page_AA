<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Details | Alejandro & Alejandra</title>
    <style>
      :root {
        --ivory: #f8f4ea;
        --text: #4a3f35;
        --accent: #93624f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ivory);
        color: var(--text);
        font-family: "Cormorant Garamond", Georgia, serif;
      }

      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 1rem 0.75rem 2rem;
      }

      .back-link {
        display: inline-block;
        margin: 0.25rem 0 1rem;
        color: var(--accent);
        text-decoration: none;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
      }

      .back-link:hover,
      .back-link:focus-visible {
        text-decoration: underline;
      }

      .invitation {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: 0 18px 45px rgba(61, 52, 47, 0.14);
      }

      @media (max-width: 600px) {
        .page {
          padding: 0.75rem 0.5rem 1.5rem;
        }

        .back-link {
          margin-left: 0.25rem;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="rsvp.html">← Back</a>
      <img
        class="invitation"
        src="images/INVITACION_FINAL_INGLES.png"
        alt="Wedding invitation details for Alejandro and Alejandra"
      />
    </main>
  </body>
</html>
